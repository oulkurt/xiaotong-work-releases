# 所有平台验证完成后，统一发布到公开产物仓库。macOS 本轮仅手动安装。
name: Verified release build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.1.19
  cancel-in-progress: false
env:
  RELEASE_REPOSITORY: oulkurt/xiaotong-work-releases

jobs:
  verify-version:
    name: 核对公开仓库最新版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oulkurt/xiaotong-work
          ref: v0.1.19
          ssh-key: ${{ secrets.RELEASE_SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: 正式版本从公开 Release 顺延
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/$RELEASE_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PATCH=${LATEST##*.}
          EXPECTED="${LATEST%.*}.$((PATCH + 1))"
          echo "公开最新版本：$LATEST；本次应发布：$EXPECTED"
          test "v0.1.19" = "$EXPECTED"
      - name: 准备未公开的发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if gh release view "v0.1.19" --repo "$RELEASE_REPOSITORY" --json isDraft > /tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = true
          else
            gh release create "v0.1.19" --repo "$RELEASE_REPOSITORY" --target main --draft --title "小瞳 Work v0.1.19" --notes-file "release-notes/v0.1.19.md"
          fi

  build:
    name: build (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oulkurt/xiaotong-work
          ref: v0.1.19
          ssh-key: ${{ secrets.RELEASE_SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Linux 打包与冒烟依赖
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2 libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
      - name: 安装依赖并校验版本
        run: |
          bun install --frozen-lockfile
          VERSION=$(bun -p "require('./apps/electron/package.json').version")
          test "v0.1.19" = "v$VERSION"
      - name: 类型检查与发布回归测试
        timeout-minutes: 10
        run: |
          bun run --cwd apps/electron typecheck
          bun test apps/cli/src/terminal/command-installation.test.ts apps/cli/src/terminal/windows-command-path.test.ts apps/cli/scripts/prepare-xt-tools.test.ts
          bun test apps/electron/src/main/lib/github-release-service.test.ts
          bun test apps/electron/src/main/lib/company-image-tool.test.ts
          bun test apps/electron/src/main/lib/adapters/deepseek-flash.test.ts apps/electron/src/main/lib/channel-runtime-api-key.test.ts
          bun test apps/electron/src/main/lib/company-member-name.test.ts apps/electron/src/main/lib/company-oauth.test.ts apps/electron/src/main/lib/update-relaunch.test.ts apps/electron/src/main/lib/updater/updater-wiring.test.ts apps/electron/src/main/lib/updater/idle-install-scheduler.test.ts apps/electron/src/main/lib/updater/manual-mac-update.test.ts apps/electron/src/main/lib/brand-icons.test.ts apps/electron/src/main/tray.test.ts apps/electron/src/renderer/atoms/ui-preferences.test.ts apps/electron/src/renderer/atoms/updater.test.ts
      - name: 构建全部应用组件
        run: bun run electron:build
      - name: 同步运行时依赖并重建 PTY
        working-directory: apps/electron
        run: bun run sync:runtime-deps && bun run rebuild:node-pty
      - name: 打包应用目录
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
      - name: macOS 手动安装包签名与验证
        if: matrix.platform == 'mac'
        working-directory: apps/electron
        run: |
          APP_PATH=$(find out -maxdepth 2 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          node scripts/sign-mac-manual.cjs "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: 验证打包运行时
        timeout-minutes: 3
        working-directory: apps/electron
        run: bun run scripts/verify-packaged-runtime.ts
      - name: 生成安装包
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ '${{ matrix.platform }}' = mac ]; then
            PACKED=$(find out -maxdepth 2 -name '*.app' -print -quit)
          elif [ '${{ matrix.platform }}' = win ]; then
            PACKED=out/win-unpacked
          else
            PACKED=out/linux-unpacked
          fi
          bunx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --prepackaged "$PACKED" --publish never
      - name: Linux 安装包冒烟
        if: matrix.platform == 'linux'
        working-directory: apps/electron
        run: |
          sudo dpkg -i out/*.deb
          dpkg-query -W xiaotong-work
          test -x '/opt/小瞳 Work/xiaotong-work'
          test -f /usr/share/applications/xiaotong-work.desktop
          chmod +x out/*.AppImage
          out/*.AppImage --appimage-extract > /dev/null
          ELECTRON_RUN_AS_NODE=1 squashfs-root/xiaotong-work -e "require('node:assert/strict').ok(process.versions.electron)"
          set +e
          APPDIR="$PWD/squashfs-root" timeout 20s xvfb-run -a squashfs-root/AppRun --no-sandbox > /tmp/xiaotong-startup.log 2>&1
          RESULT=$?
          set -e
          cat /tmp/xiaotong-startup.log
          test "$RESULT" -eq 124
          grep -F '[启动] 主窗口已就绪' /tmp/xiaotong-startup.log
          ! grep -E 'Cannot find module|ERR_DLOPEN_FAILED|bootstrap 致命错误|主 Renderer.*(失败|异常退出)|降级.*失败' /tmp/xiaotong-startup.log
      - name: Windows 安装包冒烟
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: apps/electron
        run: |
          $installer = Get-ChildItem out -Filter '*Setup*.exe' | Select-Object -First 1
          # Start-Process does not quote array elements containing spaces reliably;
          # keep the smoke-test destination ASCII and without spaces.
          $installDir = Join-Path $env:RUNNER_TEMP 'xiaotong-work-install-smoke'
          $originalPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $process = Start-Process $installer.FullName -ArgumentList '/S', '/currentuser', "/D=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exit: $($process.ExitCode)" }
          $installed = Join-Path $installDir '小瞳 Work.exe'
          if (!(Test-Path $installed)) { throw 'Installed executable missing' }
          bun run scripts/verify-packaged-runtime.ts "$installDir"
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime failed' }
          $commandDir = Join-Path $env:USERPROFILE '.xiaotong-work\bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (!($userPath -split ';' | Where-Object { $_ -eq $commandDir })) { throw 'Installer did not add xt to user PATH' }
          if ($originalPath -and !$userPath.StartsWith($originalPath)) { throw 'Installer changed existing PATH entries' }
          $env:Path = "$env:Path;$commandDir"
          $version = & xt --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^xt ') { throw 'PowerShell xt launcher failed' }
          cmd.exe /d /c 'xt --help'
          if ($LASTEXITCODE -ne 0) { throw 'CMD xt launcher failed' }
          & (Join-Path $installDir 'resources\xt\xt.exe') --install
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (@($userPath -split ';' | Where-Object { $_ -eq $commandDir }).Count -ne 1) { throw 'Repeated install duplicated PATH' }
          $uninstaller = Get-ChildItem $installDir -Filter '*Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller missing' }
          $removed = Start-Process $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($removed.ExitCode -ne 0) { throw 'Uninstaller failed' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -split ';' | Where-Object { $_ -eq $commandDir }) { throw 'Uninstaller left xt PATH entry' }
          if (Test-Path (Join-Path $commandDir 'xt.cmd')) { throw 'Uninstaller left xt launcher' }
      - name: 收集发布资产
        working-directory: apps/electron
        run: |
          mkdir -p release-assets
          if [ '${{ matrix.platform }}' = mac ]; then
            cp out/*.dmg out/*.zip release-assets/
          elif [ '${{ matrix.platform }}' = win ]; then
            cp out/*.exe out/*.blockmap out/latest.yml release-assets/
          else
            cp out/*.AppImage out/*.deb out/latest-linux.yml release-assets/
          fi
      - name: 上传已验证的平台安装包到草稿
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "v0.1.19" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft)" = true
          for attempt in 1 2 3; do
            if gh release upload "v0.1.19" release-assets/* --repo "$RELEASE_REPOSITORY" --clobber; then break; fi
            test "$attempt" -lt 3 || exit 1
            sleep 10
          done
          gh release view "v0.1.19" --repo "$RELEASE_REPOSITORY" --json assets > uploaded-assets.json
          PYTHON_CMD=python3
          if [ '${{ matrix.platform }}' = win ]; then PYTHON_CMD=python; fi
          "$PYTHON_CMD" - <<'PY'
          import json
          from pathlib import Path
          uploaded = {asset['name']: asset['size'] for asset in json.loads(Path('uploaded-assets.json').read_text())['assets']}
          local = list(Path('release-assets').iterdir())
          assert local, '平台发布资产不能为空'
          for asset in local:
              assert asset.stat().st_size > 0 and uploaded.get(asset.name) == asset.stat().st_size, f'上传资产大小不匹配: {asset.name}'
          PY

  publish-release:
    name: publish verified release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oulkurt/xiaotong-work
          ref: v0.1.19
          ssh-key: ${{ secrets.RELEASE_SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: 校验完整资产清单后公开发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh release view "v0.1.19" --repo "$RELEASE_REPOSITORY" --json isDraft,assets > /tmp/release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('/tmp/release.json').read_text())
          version = 'v0.1.19'.removeprefix('v')
          expected = {f'Xiaotong-Work-{version}-{arch}-mac.{ext}' for arch in ['arm64', 'x64'] for ext in ['dmg', 'zip']}
          expected.update({f'Xiaotong-Work-Setup-{version}-x64.exe', f'Xiaotong-Work-Setup-{version}-x64.exe.blockmap', f'Xiaotong-Work-{version}-x86_64.AppImage', f'xiaotong-work_{version}_amd64.deb', 'latest.yml', 'latest-linux.yml'})
          assert release['isDraft'], '只能公开已验证的草稿'
          assert {asset['name'] for asset in release['assets']} == expected, '发布资产清单不完整或存在其他版本文件'
          assert all(asset['size'] > 0 for asset in release['assets']), '发布资产不能为空'
          PY
          gh release edit "v0.1.19" --repo "$RELEASE_REPOSITORY" --notes-file "release-notes/v0.1.19.md" --draft=false --latest
