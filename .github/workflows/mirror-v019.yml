name: Mirror verified v0.1.19
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-updates-r2
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oulkurt/xiaotong-work
          ref: 4006475f21edaf73126231062b1d985b8ceba977
          ssh-key: ${{ secrets.TEMP_V019_MIRROR_SOURCE_KEY }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 校验镜像发布逻辑
        run: bun test apps/electron/scripts/mirror-updates.test.ts apps/electron/scripts/download-page/
      - name: 核对已公开版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/oulkurt/xiaotong-work-releases/releases/latest --jq .tag_name)" = "v0.1.19"
          test "$(git rev-parse HEAD)" = "4006475f21edaf73126231062b1d985b8ceba977"
      - name: 同步并验证公开下载源
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: 6f2ee9e3edd5d47a1a2aa2ec6021ee91
          R2_BUCKET: xiaotong-work-updates
          R2_ACCESS_KEY_ID: ${{ secrets.TEMP_V019_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.TEMP_V019_R2_SECRET_ACCESS_KEY }}
        run: bun run apps/electron/scripts/mirror-updates.ts
